name: 数据每日增量更新

on:
  schedule:
    # GitHub Actions cron 使用 UTC；A 股 15:00 收盘，数据商日K一般 16:00 后完成更新。
    # 以下覆盖北京时间（UTC+8）周一至周五 16:00 ~ 19:00，每 30 分钟一次（UTC 08:00 ~ 11:00），
    # 共 7 个冗余时间点：GitHub 定时调度可能延迟数分钟甚至数小时（实测首日延迟约 7 小时），
    # 脚本幂等（无新交易日不写文件、不提交），多次触发安全，保证最终一致。
    - cron: '0 8 * * 1-5'
    - cron: '30 8 * * 1-5'
    - cron: '0 9 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '30 10 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因（可选）'
        default: 'manual'
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 增量更新历史数据
        run: npm run data:update

      - name: 数据校验
        run: npm run data:validate

      - name: 提交并推送数据变更
        run: |
          if [[ -n "$(git status --porcelain public/data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "chore(data): 每日增量更新（run $GITHUB_RUN_ID）"
            git push
            echo "DATA_CHANGED=true" >> "$GITHUB_ENV"
            echo "已提交数据变更（GITHUB_TOKEN 的推送不会触发 push 事件，重新部署由 deploy.yml 的 workflow_run 监听完成）"
          else
            echo "数据无变化，跳过提交（节假日 / 数据源未更新）"
          fi

      - name: 微信推送提醒（虾推啥通道）
        if: env.DATA_CHANGED == 'true'
        continue-on-error: true
        env:
          XTUIS_PUSH_URLS: ${{ secrets.XTUIS_PUSH_URLS }}
        run: npm run data:notify
